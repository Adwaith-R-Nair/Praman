packages:
  - "packages/*"
  - "apps/*"
allowBuilds:
  esbuild: true
  # @prisma/engines' postinstall fetches the native query/schema-engine
  # binaries; without it `prisma generate`/`migrate` cannot talk to
  # Postgres at all. Required functionality, same as esbuild above.
  '@prisma/engines': true
  prisma: true
  # Transitive prisma deps. msgpackr-extract is a native msgpack accelerator
  # (JS fallback works fine); workerd is Cloudflare's Workers runtime, for
  # Prisma's edge/D1 adapters — we use @prisma/adapter-pg against local
  # Postgres, so neither's postinstall script does anything we need.
  msgpackr-extract: false
  workerd: false
  # @google/genai's package.json declares a `prepare` script (scripts/prepare.js)
  # and protobufjs declares a `postinstall` (scripts/postinstall) — neither
  # file actually ships in the published npm tarball (checked: both paths are
  # missing from node_modules). Running them is a harmless no-op/failure, not
  # a security concern, but nothing to gain from allowing either either.
  '@google/genai': false
  protobufjs: false
